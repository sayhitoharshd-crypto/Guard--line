
name: LineGuard Standalone Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LineGuard Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract LineGuard source ZIP
        id: project
        shell: bash
        run: |
          mkdir -p /tmp/lineguard/source
          FOUND=false

          for ZIP in ./*.zip; do
            [ -f "$ZIP" ] || continue

            TEMP="/tmp/lineguard/candidate"
            rm -rf "$TEMP"
            mkdir -p "$TEMP"

            if unzip -q "$ZIP" -d "$TEMP" 2>/dev/null; then
              APP_JSON=$(find "$TEMP" -path '*/artifacts/lineguard/app.json' -print -quit)

              if [ -n "$APP_JSON" ]; then
                cp -a "$TEMP/." /tmp/lineguard/source/
                FOUND=true
                echo "Found LineGuard source in $ZIP"
                break
              fi
            fi
          done

          if [ "$FOUND" != "true" ]; then
            echo "ERROR: No ZIP containing artifacts/lineguard/app.json was found."
            exit 1
          fi

          APP_JSON=$(find /tmp/lineguard/source -path '*/artifacts/lineguard/app.json' -print -quit)
          APP_DIR=$(dirname "$APP_JSON")
          ROOT_DIR=$(find /tmp/lineguard/source -name pnpm-workspace.yaml -printf '%h\n' -quit)

          if [ -z "$ROOT_DIR" ]; then
            echo "ERROR: pnpm workspace root not found."
            exit 1
          fi

          if [ ! -f "$APP_DIR/google-services.json" ]; then
            echo "ERROR: Firebase google-services.json is missing."
            exit 1
          fi

          echo "app=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "root=$ROOT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licences
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools"

      - name: Install workspace dependencies
        working-directory: ${{ steps.project.outputs.root }}
        run: pnpm install --no-frozen-lockfile

      - name: Verify Expo dependencies
        working-directory: ${{ steps.project.outputs.app }}
        run: |
          node -e "console.log('Expo:', require('expo/package.json').version)"
          node -e "console.log('React Native:', require('react-native/package.json').version)"

      - name: Generate Android project
        working-directory: ${{ steps.project.outputs.app }}
        env:
          CI: "1"
        run: |
          pnpm exec expo prebuild --platform android --clean --no-install

      - name: Remove unnecessary Foojay resolver
        working-directory: ${{ steps.project.outputs.app }}/android
        shell: bash
        run: |
          if [ ! -f settings.gradle ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          sed -i '/foojay-resolver-convention/d' settings.gradle

          if grep -q 'foojay-resolver-convention' settings.gradle; then
            echo "ERROR: Foojay resolver was not removed."
            exit 1
          fi

          echo "Gradle settings after patch:"
          cat settings.gradle

      - name: Build standalone Release APK
        working-directory: ${{ steps.project.outputs.app }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK and embedded JavaScript bundle
        working-directory: ${{ steps.project.outputs.app }}/android
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          if ! unzip -l "$APK" | grep -q 'assets/index.android.bundle'; then
            echo "ERROR: Embedded JavaScript bundle not found."
            exit 1
          fi

          echo "Standalone APK verified."
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: LineGuard-Standalone-Release-APK
          path: ${{ steps.project.outputs.app }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
