
name: LineGuard Standalone Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Standalone LineGuard APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract LineGuard source
        id: project
        shell: bash
        run: |
          mkdir -p /tmp/lineguard

          FOUND=false

          for ZIP in ./*.zip; do
            [ -f "$ZIP" ] || continue

            TEMP="/tmp/lineguard/check"
            mkdir -p "$TEMP"

            if unzip -q "$ZIP" -d "$TEMP" 2>/dev/null; then
              APP_JSON=$(find "$TEMP" -path '*/artifacts/lineguard/app.json' -print -quit)

              if [ -n "$APP_JSON" ]; then
                cp -a "$TEMP/." /tmp/lineguard/
                FOUND=true
                break
              fi
            fi

            rm -rf "$TEMP"
          done

          if [ "$FOUND" != "true" ]; then
            echo "ERROR: LineGuard source ZIP not found."
            exit 1
          fi

          APP_DIR=$(find /tmp/lineguard -path '*/artifacts/lineguard/app.json' -print -quit | xargs dirname)
          ROOT_DIR=$(find /tmp/lineguard -name pnpm-workspace.yaml -printf '%h\n' -quit)

          test -f "$APP_DIR/package.json"
          test -f "$APP_DIR/google-services.json"

          echo "app=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "root=$ROOT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.root }}
        run: pnpm install --no-frozen-lockfile

      - name: Accept Android SDK licences
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools"

      - name: Generate Android native project
        working-directory: ${{ steps.project.outputs.app }}
        env:
          CI: "1"
        run: |
          pnpm exec expo prebuild --platform android --clean --no-install

      - name: Install generated dependencies
        working-directory: ${{ steps.project.outputs.root }}
        run: pnpm install --no-frozen-lockfile

      - name: Build standalone Release APK
        working-directory: ${{ steps.project.outputs.app }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify embedded application bundle
        working-directory: ${{ steps.project.outputs.app }}/android
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          unzip -l "$APK" | grep -E 'assets/index.android.bundle|assets/.+bundle'

          sha256sum "$APK"

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: LineGuard-Standalone-Release-APK
          path: ${{ steps.project.outputs.app }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
