
name: LineGuard Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LineGuard APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find and extract LineGuard project
        id: project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found."
            exit 1
          fi

          mkdir -p /tmp/lineguard
          unzip -q "$ZIP_FILE" -d /tmp/lineguard

          APP_JSON=$(find /tmp/lineguard -path '*/artifacts/lineguard/app.json' -print -quit)
          if [ -z "$APP_JSON" ]; then
            echo "ERROR: app.json not found."
            exit 1
          fi

          APP_DIR=$(dirname "$APP_JSON")
          ROOT_DIR=$(find /tmp/lineguard -name pnpm-workspace.yaml -printf '%h\n' -quit)

          if [ -z "$ROOT_DIR" ]; then
            echo "ERROR: pnpm workspace not found."
            exit 1
          fi

          echo "app=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "root=$ROOT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.root }}
        run: pnpm install --no-frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licences
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools"

      - name: Check Expo installation
        working-directory: ${{ steps.project.outputs.app }}
        run: |
          node -e "console.log('Expo:', require.resolve('expo/package.json'))"
          node -e "console.log('React:', require.resolve('react/package.json'))"
          node -e "console.log('React Native:', require.resolve('react-native/package.json'))"

      - name: Generate Android project
        working-directory: ${{ steps.project.outputs.app }}
        env:
          CI: "1"
        run: pnpm exec expo prebuild --platform android --clean

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.app }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LineGuard-debug-APK
          path: ${{ steps.project.outputs.app }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
