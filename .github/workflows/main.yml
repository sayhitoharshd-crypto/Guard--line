
name: LineGuard Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LineGuard Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract LineGuard ZIP
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/lineguard

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d /tmp/lineguard

      - name: Locate LineGuard project
        id: project
        shell: bash
        run: |
          set -e

          WORKSPACE=$(find /tmp/lineguard -name pnpm-workspace.yaml -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: pnpm-workspace.yaml not found."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$WORKSPACE")

          APP_CONFIG=$(find "$PROJECT_ROOT" \
            -path '*/node_modules/*' -prune -o \
            -path '*/artifacts/lineguard/app.json' -print | head -1)

          if [ -z "$APP_CONFIG" ]; then
            echo "ERROR: LineGuard app.json not found."
            exit 1
          fi

          APP_DIR=$(dirname "$APP_CONFIG")

          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "app=$APP_DIR" >> "$GITHUB_OUTPUT"

          echo "Project root: $PROJECT_ROOT"
          echo "App directory: $APP_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.root }}
        run: pnpm install --no-frozen-lockfile

      - name: Initialize Git for EAS
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          git init
          git config user.name "LineGuard Build"
          git config user.email "lineguard-build@example.com"
          git add -A
          git commit -m "Prepare LineGuard Android build"

      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN secret is missing."
            exit 1
          fi
          echo "Expo token is configured."

      - name: Initialize Expo project
        working-directory: ${{ steps.project.outputs.app }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli init \
            --account arshdxr \
            --non-interactive

      - name: Build Android APK with EAS
        working-directory: ${{ steps.project.outputs.app }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli build \
            --platform android \
            --profile preview \
            --non-interactive
